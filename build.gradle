plugins {
    id 'idea'
    id "maven-publish"
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'org.spongepowered.mixin' version '0.7.+'

}
def generatedResources = file("src/generated")


sourceSets {
    main.resources {
        srcDir generatedResources
    }
    main.java {
        // 多版本源码集：按 gtm_version 选择 GTUF 的版本分源。src/main/java 为版本无关共享代码，
        // 下列变体目录互斥、每次构建只有一组进入编译路径：
        //   gtm_version 前缀 7.5 → src/main/java75：RecipeCondition<T> 自引用泛型 +
        //     client.model.pipe.PipeModel 动态模型（RegisterDynamicResourcesEvent）
        //   gtm_version = 7.1.4 → src/main/java714 + src/main/java-legacy-pipe：
        //     714 为 RecipeCondition 非泛型且 serialize 可覆写（7.1.4 网络同步走
        //     toNetwork/fromNetwork，需覆写补齐 min/max）；legacy-pipe 为旧
        //     client.model.PipeModel 构造器内建模型（7.1.4~7.4.1 共用）
        //   gtm_version 7.2.x/7.3.x/7.4.x → src/main/java72x + src/main/java-legacy-pipe：
        //     72x 为 RecipeCondition 非泛型 + serialize final/static（纯 Codec 序列化，无覆写）
        if (gtm_version.startsWith('7.5')) {
            srcDir 'src/main/java75'
        } else {
            srcDir 'src/main/java-legacy-pipe'
            if (gtm_version.startsWith('7.1')) {
                srcDir 'src/main/java714'
            } else {
                srcDir 'src/main/java72x'
            }
        }
    }
    // testmod：测试专用源码集，仅 dev/测试运行环境加载，不打包进公开发布 jar。
    // 承载测试机器注册类（GTUF_Machine_Test），引用 main 的框架 API（部件类、机器类、注册类）。
    testmod {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

repositories {
    // 本地 GTM jar 优先（快速切换版本测试）：libs/gtm/ 下放 gtceu-1.20.1-<gtm_version>-slim.jar，
    // 依赖坐标命中本地 flatDir；无本地文件时自动回退下面的 GTCEu Maven。详见 gradle.properties 的 gtm_version 注释。
    flatDir {
        dirs 'libs/gtm'
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdarkdev.xyz/snapshots/"
    }

    maven {
        // latvian.dev Maven (KubeJS and Rhino)
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        // location of the maven that hosts JEI files before January 2023
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        url = "https://maven.architectury.dev"
    }

    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
        content {
            includeGroup 'appeng'
        }
    }
    maven { url = "https://maven.parchmentmc.org" }
}
group = mod_group_id
version = mod_version
base {archivesName = mod_id}
// Lombok 1.18.24 不支持 JDK 21（JCTree$JCImport.qualid 在 JDK 21 已移除）。
// 用 toolchain 锁定编译 JVM 为 JDK 17，避免 IDE 以捆绑 JDK 21 启动 Gradle 时编译崩溃。
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: mapping_channel,
            version: mapping_version
    copyIdeResources = true

    runs {

        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            // dev 运行时同时加载 main 与 testmod 源码集；jar 只打 main，公开发布不含测试内容
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.testmod
                }
            }
        }

        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
        data {
            workingDirectory project.file('run-data')
            // 数据生成必需参数（源码集已由 configureEach 的 mods{} 统一绑定 main + testmod）
            args '--mod', mod_id
            args '--all'
            args '--output', file('src/generated/resources/').getAbsolutePath()
            args '--existing', file('src/main/resources/').getAbsolutePath()
            args '--existing-mod', 'gtceu'
        }
    }
}
apply from: "$rootDir/gradle/scripts/spotless.gradle"


mixin {
    // MixinGradle Settings：refmap 供 dev 运行时 remapRefMap + 发布 reobfJar 时反混淆
    add sourceSets.main, 'mixins.gtuf.refmap.json'
    config 'mixins.gtuf.json'
}


dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    //GTM
    // 本地 GTM jar（快速切换版本测试）：在 libs/gtm/ 下放 gtceu-1.20.1-<gtm_version>-slim.jar
    // 并改 gradle.properties 的 gtm_version，此坐标会优先命中顶部 repositories 的本地 flatDir；
    // 本地没有该版本时自动回退 maven.gtceu.com 解析同名 slim 包。
    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}:slim") { transitive = false
        exclude group: 'com.tterrag.registrate'}
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"){transitive = false}
    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    implementation fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    runtimeOnly(fg.deobf("dev.architectury:architectury-forge:${architectury_version}"))
    implementation fg.deobf("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    implementation fg.deobf("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    //JEI
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    //Jade（optional，供线程仓线程信息显示；compileOnly 让 @WailaPlugin/provider 可编译，
    // runtimeOnly 让 dev 运行带 Jade 验证；正式 jar 不含 Jade、未装 Jade 时不加载本类）
    compileOnly fg.deobf("curse.maven:jade-324717:5390389")
    runtimeOnly fg.deobf("curse.maven:jade-324717:5390389")







    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"


    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    implementation 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}




// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license"      : mod_license,
            "mod_id"           : mod_id,
            "version"          : version,
            "mod_name"         : mod_name,
            "mod_url"          : mod_url,
            "mod_author"       : mod_author,
            "forge_version"    : forge_version.split("\\.")[0], // only specify major version of forge
            "minecraft_version": minecraft_version,
            "gtceu_version_range": gtceu_version_range,
    ]

    inputs.properties(properties)

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_author,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_author,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    finalizedBy 'reobfJar'}

// 发布用源码 jar：与 mod jar 一起上传到 GitHub Release。
// GitHub 会在每个 tag/Release 自动生成 "Source code (zip)" 与 "Source code (tar.gz)" 压缩包
// （无需手动制作），本任务额外产出 *-sources.jar 供 IDE 调试 / 阅读源码（可选上传）。
tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}

// `./gradlew build` 一并产出 mod jar（reobf 后）+ sources jar
tasks.named('build') {
    dependsOn 'sourcesJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release.set(17)
}
