modLoader = "javafml"
loaderVersion ="[47,)"
license = "${mod_license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
authors="${mod_author}"
description = ''


[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "gtceu"
mandatory = true
versionRange = "[${gtceu_version},)"
ordering = "AFTER"
side = "BOTH"
# Jade 为可选依赖：仅用于线程仓的线程信息提示显示；未装 Jade 时不影响核心功能。
[[dependencies."${mod_id}"]]
modId = "jade"
mandatory = false
versionRange = "[11.6.3,)"
ordering = "AFTER"
side = "BOTH"
